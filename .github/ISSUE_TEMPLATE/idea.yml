name: An idea
description: Something Jukebox could do, or do differently.
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: What you are trying to do, more than how it should look. Another player that does it well is a good pointer.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What you do now instead
